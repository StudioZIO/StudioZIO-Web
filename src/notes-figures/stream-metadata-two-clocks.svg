<svg viewBox="0 0 640 360" role="img" aria-labelledby="nf-clocks-t nf-clocks-d" xmlns="http://www.w3.org/2000/svg"><title id="nf-clocks-t">Aligned container timestamps, offset content</title><desc id="nf-clocks-d">Both streams start at 0.000 on the container timeline. Inside the audio stream, each tone begins 120 milliseconds after the video flash it belongs to.</desc><text x="0.0" y="102.0" class="nf-text" font-size="24" font-weight="600" text-anchor="start">video</text><text x="0.0" y="238.0" class="nf-text" font-size="24" font-weight="600" text-anchor="start">audio</text><rect x="104" y="70" width="512" height="48" rx="6" class="nf-track"/><rect x="104" y="206" width="512" height="48" rx="6" class="nf-track"/><rect x="104.0" y="73" width="11.4" height="42" class="nf-flash"/><rect x="445.3" y="73" width="11.4" height="42" class="nf-flash"/><rect x="145.0" y="209" width="17.1" height="42" class="nf-tone"/><rect x="486.3" y="209" width="17.1" height="42" class="nf-tone"/><line x1="104.0" y1="40" x2="104.0" y2="266" class="nf-start"/><text x="114.0" y="58.0" class="nf-good" font-size="22" font-weight="600" text-anchor="start">start_time 0.000 in both streams</text><line x1="445.3" y1="118" x2="445.3" y2="206" class="nf-bracket-guide"/><line x1="486.3" y1="118" x2="486.3" y2="206" class="nf-bracket-guide"/><line x1="445.3" y1="162.0" x2="486.3" y2="162.0" class="nf-bracket"/><text x="498.3" y="171.0" class="nf-bad" font-size="26" font-weight="700" text-anchor="start">120 ms</text><text x="435.3" y="144.0" class="nf-muted" font-size="22" font-weight="400" text-anchor="end">flash</text><text x="496.3" y="280.0" class="nf-muted" font-size="22" font-weight="400" text-anchor="start">tone</text><line x1="104" y1="316" x2="616" y2="316" class="nf-axis"/><line x1="104.0" y1="310" x2="104.0" y2="322" class="nf-axis"/><text x="104.0" y="348.0" class="nf-muted" font-size="22" font-weight="400" text-anchor="start">0.0 s</text><line x1="274.7" y1="310" x2="274.7" y2="322" class="nf-axis"/><text x="274.7" y="348.0" class="nf-muted" font-size="22" font-weight="400" text-anchor="middle">0.5 s</text><line x1="445.3" y1="310" x2="445.3" y2="322" class="nf-axis"/><text x="445.3" y="348.0" class="nf-muted" font-size="22" font-weight="400" text-anchor="middle">1.0 s</text><line x1="616.0" y1="310" x2="616.0" y2="322" class="nf-axis"/><text x="616.0" y="348.0" class="nf-muted" font-size="22" font-weight="400" text-anchor="end">1.5 s</text></svg>
